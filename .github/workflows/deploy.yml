name: Deploy

# Called by ci.yml after `check` passes on a push to main (S1-08).
on:
  workflow_call:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # OIDC sub = repo:dhnhut@5567608/cv-tailor@1386961484:environment:dev (immutable subject).
    # The Environment's branch rule limits it to main.
    environment: dev
    permissions:
      contents: read
      id-token: write # lets the job request a GitHub OIDC token for AWS
    concurrency:
      group: deploy-dev
      cancel-in-progress: false # never stop an apply halfway: it holds the state lock
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Enable Corepack (pnpm version from packageManager)
        run: corepack enable

      # setup-node's pnpm cache needs pnpm on PATH before it runs, so cache the store explicitly.
      - name: Get pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile

      # Before AWS credentials, like install: the build runs third-party code (Vite and its plugins).
      - name: Build the web app (deploy-web.sh uploads apps/web/dist)
        run: pnpm --filter @cv-tailor/web run build

      # Before AWS credentials too: esbuild bundles the pre sign-up trigger (S2-07), GET /me (S2-09), and the document API (S3-07).
      - name: Build the API Lambdas (the workload stack zips apps/api/dist)
        run: pnpm --filter @cv-tailor/api run build

      # The same version as the check job and the devcontainer (ADR-0013 §1).
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.13.1
          tofu_wrapper: false # the wrapper rewrites tofu's output, which deploy-web.sh reads

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/opentofu/plugins
          key: tofu-providers-${{ runner.os }}-${{ hashFiles('infra/stacks/workload/.terraform.lock.hcl') }}

      # After install and the builds, so no third-party code sees AWS credentials.
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-region: us-east-1
          role-to-assume: arn:aws:iam::${{ secrets.CVT_DEV_ACCOUNT_ID }}:role/GithubDeployRole
          role-session-name: cv-tailor-deploy-${{ github.run_id }}
          mask-aws-account-id: true # off by default in v6

      - name: Show deploy identity
        run: aws sts get-caller-identity --query Arn --output text

      # Only the workload stack, ever: GithubDeployRole can read and write no other state, and
      # can't change its own access, the budget, the kill switch, or DNS (ADR-0013 §5). The plan
      # is saved, encrypted, and applied as reviewed in the log.
      - name: Apply the dev workload stack
        working-directory: infra
        env:
          CVT_DEV_ACCOUNT_ID: ${{ secrets.CVT_DEV_ACCOUNT_ID }}
          TF_IN_AUTOMATION: '1'
        run: |
          scripts/tofu.sh dev workload plan -input=false -out=tfplan
          scripts/tofu.sh dev workload apply -input=false tfplan

      # Writes config.json from the stack's outputs, checked against the WebConfig contract first.
      - name: Upload the web app
        working-directory: infra
        env:
          CVT_DEV_ACCOUNT_ID: ${{ secrets.CVT_DEV_ACCOUNT_ID }}
          TF_IN_AUTOMATION: '1'
        run: scripts/deploy-web.sh dev
