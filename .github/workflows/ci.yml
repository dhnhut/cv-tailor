name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read # least privilege: CI only reads the repo

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }} # never cancel runs on main

jobs:
  check: # stable job name, required by the branch protection ruleset (S0-06)
    runs-on: ubuntu-24.04
    timeout-minutes: 20 # 15 before S3-15; tofu test downloads the AWS provider on a cold cache
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
      UV_LOCKED: '1' # uv fails if uv.lock is out of date (Python twin of --frozen-lockfile)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Enable Corepack (pnpm version from packageManager)
        run: corepack enable

      # setup-node's pnpm cache needs pnpm on PATH before it runs, so cache the store explicitly.
      - name: Get pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: '3.12'
          enable-cache: true
          cache-dependency-glob: services/agents/uv.lock

      # The infrastructure tools (S3-15, ADR-0013), at the versions in .devcontainer/install-iac-tools.sh.
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.13.1
          tofu_wrapper: false # the wrapper rewrites tofu's output, which the scripts read

      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: v0.64.0

      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.75.0

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/opentofu/plugins
            ~/.tflint.d/plugins
          key: iac-${{ runner.os }}-${{ hashFiles('infra/stacks/*/.terraform.lock.hcl', 'infra/.tflint.hcl') }}
          restore-keys: iac-${{ runner.os }}-

      - name: Tool versions
        run: node -v && pnpm -v && uv --version && uv run --directory services/agents python --version && tofu version && tflint --version && trivy --version

      # A step of its own, so the token reaches only TFLint's plugin download (GitHub API rate limit),
      # not the third-party code that `pnpm run check` runs. Lint then finds the plugin installed.
      - name: Install the TFLint AWS ruleset
        working-directory: infra
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: tflint --init --config="$PWD/.tflint.hcl"

      - run: pnpm install --frozen-lockfile

      - name: Sync Python dependencies
        run: uv sync
        working-directory: services/agents

      - name: Lint (including workflows), typecheck, test, build (build includes tofu validate)
        run: pnpm run check

      # Runs last: it regenerates the contracts, which changes the working tree.
      - name: Contracts drift check
        run: pnpm run contracts:check
  deploy-dev:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write # the called workflow can't have more permissions than this job
    uses: ./.github/workflows/deploy.yml
    secrets: inherit # the called workflow's secrets context is empty without this
