version: 2
updates:
  # Keeps the SHA-pinned actions in .github/workflows up to date.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ['*']

  # The pnpm workspace: one lockfile at the root covers every TypeScript package.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm-minor-patch:
        update-types: [minor, patch]

  # The Python agent service (uv.lock).
  - package-ecosystem: uv
    directory: /services/agents
    schedule:
      interval: weekly
    groups:
      uv-minor-patch:
        update-types: [minor, patch]

  # The OpenTofu stacks' provider lock files (S3-15). Modules share the stacks' providers.
  - package-ecosystem: opentofu
    directories:
      - /infra/stacks/*
    schedule:
      interval: weekly
    groups:
      opentofu-providers:
        patterns: ['*']
