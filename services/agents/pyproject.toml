[project]
name = "cv-tailor-agents"
version = "0.1.0"
description = "AI agents for CV Tailor (LangGraph on Bedrock AgentCore)"
readme = "README.md"
authors = [{ name = "dhnhut@gmail.com", email = "dhnhut@gmail.com" }]
requires-python = ">=3.12,<3.13"
dependencies = ["boto3>=1.43.108", "pydantic>=2.13.5"]

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
  "datamodel-code-generator>=0.83.0",
  "mypy>=2.3.1",
  "pytest>=9.1.1",
  "pytest-cov>=7.1.0",
  "ruff>=0.16.9",
  "types-boto3[bedrock-runtime,ssm]>=1.43.108",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.mypy]
strict = true
files = ["src", "tests", "scripts"]
python_version = "3.12"
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib", "-ra", "--strict-markers"]

[tool.datamodel-codegen]
input = "../../packages/contracts/schemas"
input-file-type = "jsonschema"
output = "src/cv_tailor_agents/contracts"
output-model-type = "pydantic_v2.BaseModel"
target-python-version = "3.12"
use-annotated = true
field-constraints = true
use-standard-collections = true
use-union-operator = true
use-schema-description = true
disable-timestamp = true
formatters = ["ruff-format", "ruff-check"]

[tool.coverage.run]
source_pkgs = ["cv_tailor_agents"]
branch = true
# Generated by datamodel-codegen from packages/contracts (ADR-0003); never hand-edited.
# contracts:check proves it matches the Zod source, and tests/test_contracts.py tests its behaviour.
omit = ["*/cv_tailor_agents/contracts/*"]

[tool.coverage.report]
fail_under = 80
show_missing = true
