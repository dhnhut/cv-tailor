# Trivy findings that are accepted, each with its reason (ADR-0013 §9). Read by scripts/lint-tofu.sh.
# Each entry is limited to the file it applies to, so the same finding anywhere else still fails.
# Format: https://trivy.dev/latest/docs/configuration/filtering/#trivyignoreyaml
misconfigurations:
  - id: AWS-0132
    paths:
      - modules/knowledge-base/main.tf
    statement: >-
      The documents bucket uses S3-managed keys (S3-06): no fixed monthly cost, and no key policy
      for the Bedrock connector's role to need. Access is limited by the bucket policy, the
      account, and each role's exact actions.

  - id: AWS-0132
    paths:
      - modules/web/main.tf
    statement: >-
      The site bucket holds only the web app's public build output, which CloudFront serves to
      anyone. A customer-managed key would protect nothing and add a key policy for CloudFront.

  - id: AWS-0011
    paths:
      - modules/web/main.tf
    # Expires at the planned first prod release (Sprint 6, ADR-0005), so CI fails until the
    # question is decided again.
    expired_at: 2026-11-04
    statement: >-
      No WAF on the web app's distribution in dev. A web ACL costs about USD 5 a month plus rules,
      which is the whole dev budget (S1-09). The site is static files, and the API has its own
      throttling (S2-09). Decide before the first prod release.
